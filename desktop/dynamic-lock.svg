<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    
    <!-- Lock Body Gradient -->
    <linearGradient id="lockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- Waves Glow -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect x="8" y="8" width="112" height="112" rx="26" ry="26" fill="url(#bgGrad)" filter="url(#dropShadow)"/>

  <!-- Subtle Inner Border Highlight -->
  <rect x="8" y="8" width="112" height="112" rx="26" ry="26" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5"/>

  <!-- Left Radar Proximity Wave -->
  <path d="M38 52 A 20 20 0 0 0 38 76" fill="none" stroke="url(#waveGrad)" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M30 44 A 32 32 0 0 0 30 84" fill="none" stroke="url(#waveGrad)" stroke-width="3" stroke-linecap="round" stroke-opacity="0.7"/>

  <!-- Right Radar Proximity Wave -->
  <path d="M90 52 A 20 20 0 0 1 90 76" fill="none" stroke="url(#waveGrad)" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M98 44 A 32 32 0 0 1 98 84" fill="none" stroke="url(#waveGrad)" stroke-width="3" stroke-linecap="round" stroke-opacity="0.7"/>

  <!-- Padlock Shackle -->
  <path d="M52 54 L52 44 A 12 12 0 0 1 76 44 L76 54" fill="none" stroke="#F8FAFC" stroke-width="5" stroke-linecap="round"/>

  <!-- Padlock Main Body -->
  <rect x="46" y="54" width="36" height="34" rx="7" ry="7" fill="url(#lockGrad)" filter="url(#dropShadow)"/>

  <!-- Keyhole / Bluetooth Core Dot -->
  <circle cx="64" cy="68" r="3.5" fill="#4F46E5"/>
  <path d="M62.5 69 L61 77 L67 77 L65.5 69 Z" fill="#4F46E5"/>
</svg>
